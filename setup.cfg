[tool:pytest]
testpaths = tests
pythonpath = .

[coverage:run]
branch = True
source = currency

[coverage:report]
show_missing = True
fail_under = 100
exclude_also =
    if __name__ == .__main__.:
    raise NotImplementedError

[flake8]
exclude = .git,.venv,venv,__pycache__,data
max-line-length = 88
